{% extends "base.html" %}
{% block title %}{{ mode }} book{% endblock %}
{% block content %}
<h1>{{ mode }} book</h1>
<form method="post" enctype="multipart/form-data">
  <label>Title <input name="title" value="{{ book.title or '' }}" required maxlength="150"></label>
  <label>Price <input name="price" type="number" step="0.01" min="0" value="{{ book.price or '' }}" required></label>
  <label>Author
    <select name="author_id" required>
      <option value="">-- choose --</option>
      {% for a in authors %}
      <option value="{{ a.author_id }}" {% if book.author_id|string == a.author_id|string %}selected{% endif %}>
        {{ a.author_id }} - {{ a.name }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Cover image (optional) <input type="file" name="cover" accept="image/*"></label>
  <button class="btn">Save</button>
  <a href="{{ url_for('books') }}">Cancel</a>
</form>
{% endblock %}
